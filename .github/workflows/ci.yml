name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux i686 (GCC, development build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install i386 build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-multilib g++-multilib cmake python3 \
            libx11-dev:i386 libxext-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
            libxrandr-dev:i386 libxfixes-dev:i386 libxss-dev:i386 libxtst-dev:i386 \
            libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libegl1-mesa-dev:i386 \
            libwayland-dev:i386 libdrm-dev:i386 libgbm-dev:i386 \
            libasound2-dev:i386 libpulse-dev:i386 libudev-dev:i386 libdbus-1-dev:i386

      # build.sh configures, builds and runs ctest (version, matching unit tests, renderer smoke tests).
      - name: Build and test
        run: ./build.sh

      # The full byte-matching check needs a retail disc and runs locally; CI verifies the
      # vendored compiler, maspsx and binutils still hash and run as the manifest expects.
      - name: Verify matching toolchain
        run: ./match.sh toolchain

      - uses: actions/upload-artifact@v4
        with:
          name: ctr_native-linux-i686
          path: build/ctr_native
          if-no-files-found: error

  linux-x64:
    name: Linux x86_64 release (wasm sandbox)
    # NOTE: The oldest supported runner, so the binary needs an older glibc and
    # runs on more distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 curl \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      # build-linux-x64.sh fetches the wasm toolchain, builds, runs ctest (incl.
      # the standalone check) and packages the tarball.
      - name: Build, test and package
        run: ./build-linux-x64.sh

      - uses: actions/upload-artifact@v4
        with:
          name: powerslide-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  android:
    name: Android (wasm sandbox)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK and CMake
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.31.6"

      # build-android.sh fetches the wasm toolchain, runs Gradle, checks the APK
      # is standalone and copies it to dist/. Debug-signed unless the keystore
      # secrets are set.
      - name: Build and package
        env:
          ANDROID_NDK_VERSION: 28.2.13676358
          ANDROID_CMAKE_VERSION: 3.31.6
        run: ./build-android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: powerslide-android
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows x86 (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # build-msvc.bat configures the windows-msvc-x86 preset, builds Release, runs ctest
      # (incl. the standalone check) and packages the zip.
      - name: Build, test and package
        shell: cmd
        run: build-msvc.bat --package

      - uses: actions/upload-artifact@v4
        with:
          name: powerslide-windows-x86
          path: |
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
