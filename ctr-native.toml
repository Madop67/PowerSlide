# CTR Native settings. Edited by the in-game menu (F1); unknown keys are ignored.

[video]
display_mode = "fullscreen"
window_width = 1920
window_height = 1080
aspect_ratio = "original"
hud_position = "edges"
render_scale = 5
integer_scaling = false
scale_filter = "smooth"
texture_filtering = false
frame_rate = 60
show_fps = true

[input.player1]
controller = "2dc8:310b"
controller_name = "XInput Controller #1"
stick_deadzone = 0
analog_press_point = 50
rumble = true
rumble_strength = 100
keyboard_cross = "C"
keyboard_cross_alt = "none"
gamepad_cross = "a"
keyboard_circle = "V"
keyboard_circle_alt = "none"
gamepad_circle = "b"
keyboard_square = "X"
keyboard_square_alt = "none"
gamepad_square = "x"
keyboard_triangle = "Z"
keyboard_triangle_alt = "none"
gamepad_triangle = "y"
keyboard_l1 = "Left Shift"
keyboard_l1_alt = "none"
gamepad_l1 = "leftshoulder"
keyboard_r1 = "Right Shift"
keyboard_r1_alt = "none"
gamepad_r1 = "rightshoulder"
keyboard_l2 = "Left Ctrl"
keyboard_l2_alt = "none"
gamepad_l2 = "+lefttrigger"
keyboard_r2 = "Right Ctrl"
keyboard_r2_alt = "none"
gamepad_r2 = "+righttrigger"
keyboard_dpad_up = "Up"
keyboard_dpad_up_alt = "none"
gamepad_dpad_up = "dpup"
keyboard_dpad_down = "Down"
keyboard_dpad_down_alt = "none"
gamepad_dpad_down = "dpdown"
keyboard_dpad_left = "Left"
keyboard_dpad_left_alt = "none"
gamepad_dpad_left = "dpleft"
keyboard_dpad_right = "Right"
keyboard_dpad_right_alt = "none"
gamepad_dpad_right = "dpright"
keyboard_start = "Return"
keyboard_start_alt = "none"
gamepad_start = "start"
keyboard_select = "Space"
keyboard_select_alt = "none"
gamepad_select = "back"
keyboard_l3 = "["
keyboard_l3_alt = "none"
gamepad_l3 = "leftstick"
keyboard_r3 = "]"
keyboard_r3_alt = "none"
gamepad_r3 = "rightstick"

